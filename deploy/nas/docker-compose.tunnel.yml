# NAS-only tunnel override. Always load after deploy/nas/docker-compose.yml.
services:
  wb-proxy:
    networks:
      - publication
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - type: bind
        source: ./tunnel/config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: tunnel_credentials
        target: tunnel-credentials.json
    networks:
      - publication
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  publication:
    driver: bridge

secrets:
  tunnel_credentials:
    file: ./tunnel/credentials.json
